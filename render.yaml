services:
  - type: web
    name: vetconnect-api
    runtime: node
    plan: free
    region: oregon
    branch: deploy/abraham
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm run start:prod
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
