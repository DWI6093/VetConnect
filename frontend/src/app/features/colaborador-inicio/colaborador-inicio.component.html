<div class="inicio-colaborador-contenedor">

  <!-- Encabezado de Bienvenida -->
  <div class="seccion-bienvenida">
    <div class="bienvenida-texto">
      <h1 class="bienvenida-titulo">
        ¡Bienvenido, {{ obtenerPrimerNombre() }}! 🐾
      </h1>
      <p class="bienvenida-subtitulo">Aquí puedes ver y administrar los negocios que tienes registrados.</p>
    </div>
  </div>

  <!-- Sección de Mis Negocios -->
  <section class="seccion-negocios">
    <div class="seccion-encabezado">
      <h2 class="seccion-titulo">Mis negocios</h2>
    </div>

    <!-- Estado en proceso -->
    <div class="panel-en-proceso">
      <div class="en-proceso-icono">🏗️</div>
      <h3 class="en-proceso-titulo">Sección en proceso</h3>
      <p class="en-proceso-descripcion">
        La gestión de negocios estará disponible próximamente. <br>
        Aquí podrás registrar y administrar tus veterinarias y tiendas de mascotas.
      </p>
      <span class="etiqueta-proximamente">Próximamente</span>
    </div>
  </section>

  <!-- Botón Agregar Negocio (deshabilitado) -->
  <div class="seccion-agregar">
    <button type="button" class="boton-agregar" disabled>
      <span class="boton-agregar-icono">＋</span>
      Agregar nuevo negocio
    </button>
  </div>

</div>
